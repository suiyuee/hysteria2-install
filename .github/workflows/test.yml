name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  debian13:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build.sh --check
      - run: bash -n install.sh dist/hysteria.sh
      - name: Debian 13 without Python
        run: bash tests/run-linux.sh
