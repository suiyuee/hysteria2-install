name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  debian13:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n hysteria.sh tests/check.sh
      - name: Debian 13 without Python
        run: bash tests/check.sh --container
  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r worker/requirements.txt
      - run: cd worker && python -m unittest discover -v
